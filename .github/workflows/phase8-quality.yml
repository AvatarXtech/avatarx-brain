name: Phase 8 production quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: node --test scripts/*.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/website build
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
        env:
          SERVICE_AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          PROVENANCE_SIGNING_SECRET: cccccccccccccccccccccccccccccccc
          MEMORY_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          TOOL_CAPABILITY_SECRET: dddddddddddddddddddddddddddddddd
          AGENTS_DATABASE_URL: postgresql://agents:password@db/agents
          ANALYTICS_DATABASE_URL: postgresql://analytics:password@db/analytics
          BRAIN_DATABASE_URL: postgresql://brain:password@db/brain
          INTELLIGENCE_DATABASE_URL: postgresql://intelligence:password@db/intelligence
          KNOWLEDGE_DATABASE_URL: postgresql://knowledge:password@db/knowledge
          MEMORY_DATABASE_URL: postgresql://memory:password@db/memory
          NEURON_DATABASE_URL: postgresql://neuron:password@db/neuron
          REDIS_URL: redis://cache:6379
